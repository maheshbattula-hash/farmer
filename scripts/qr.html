      margin-bottom: 16px;

      font-size: 24px;
      color: #38bdf8;
    }

      font-size: 15px;
      line-height: 1.5;
      margin: 8px 0;
    }
    .qr-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      display: inline-block;
      margin: 20px 0;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    .url-title {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 16px;
      font-weight: 500;
    }
    .url-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 10px;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      color: #a7f3d0;
      word-break: break-all;
      user-select: all;
      margin-top: 6px;
    }
